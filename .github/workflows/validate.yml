name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-package:
    name: Validate Community package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load FlowCast version
        shell: bash
        run: |
          set -euo pipefail
          test -f version.env
          cat version.env >> "$GITHUB_ENV"

      - name: Audit repository
        run: |
          python3 scripts/audit-public-repository.py
          python3 scripts/audit-runtime-contract.py

      - name: Validate documentation
        run: python3 scripts/docs/validate_docs.py

      - name: Check essential external links
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://github.com/chourmovs/FlowCast-Community/releases"
            "https://github.com/chourmovs/FlowCast-Community/security"
          )

          for url in "${urls[@]}"; do
            echo "Checking ${url}"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              "$url" \
              --output /dev/null
          done

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run ShellCheck
        run: |
          shellcheck \
            install.sh \
            scripts/community/*.sh \
            scripts/lib/*.sh

      - name: Validate YAML
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          files = Dir[
            "**/*.{yml,yaml}",
            ".github/**/*.{yml,yaml}"
          ].uniq

          files.each do |file|
            YAML.parse_file(file)
            puts "Valid YAML: #{file}"
          end
          RUBY

      - name: Render base Compose
        run: |
          docker compose \
            --env-file .env.example \
            --env-file version.env \
            -f compose.yml \
            config \
            --quiet

      - name: Render Docker Control Compose
        env:
          FLOWCAST_DOCKER_GID: "0"
        run: |
          docker compose \
            --env-file .env.example \
            --env-file version.env \
            -f compose.yml \
            -f compose.docker-control.yml \
            config \
            --quiet

      - name: Verify immutable image references
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            --include='compose*.yml' \
            -nE '^[[:space:]]*build:' \
            .; then
            echo "::error::Compose files must not contain build directives."
            exit 1
          fi

          if grep -R \
            --include='compose*.yml' \
            -nE 'image:.*:latest([[:space:]]|$)' \
            .; then
            echo "::error::Compose images must not use latest."
            exit 1
          fi

  website:
    name: Validate Astro website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Resolve package lock graph
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Astro project
        run: npm run check

      - name: Build Astro website
        run: npm run build

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/flowcast-mark.svg
          test -f dist/og-flowcast.svg
          test -f dist/screenshots/Capture1.png

          if grep -RInE \
            '/FlowCast-Community(flowcast|screenshots)|src="/screenshots/|href="/favicon' \
            dist; then
            echo "::error::Invalid GitHub Pages asset path."
            exit 1
          fi
