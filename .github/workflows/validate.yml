name: Validate
on: [push, pull_request]
permissions: {contents: read}
jobs:
  public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit repository
        run: |
          python3 scripts/audit-public-repository.py
          python3 scripts/audit-runtime-contract.py
      - name: Documentation policy and links
        run: python3 scripts/docs/validate_docs.py
      - name: Essential external links
        run: |
          for url in https://github.com/chourmovs/FlowCast-Community/releases https://github.com/chourmovs/FlowCast-Community/security; do
            curl --fail --silent --show-error --location --retry 2 --max-time 20 --head "$url" >/dev/null
          done
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shellcheck
        run: shellcheck install.sh scripts/community/*.sh scripts/lib/*.sh
      - name: Validate YAML
        run: ruby -e 'require "yaml"; Dir["**/*.{yml,yaml}", ".github/**/*.{yml,yaml}"].uniq.each { |f| YAML.parse_file(f) }'
      - name: Render Compose
        run: |
          docker compose --env-file .env.example -f compose.yml config --quiet
          FLOWCAST_DOCKER_GID=0 docker compose --env-file .env.example -f compose.yml -f compose.docker-control.yml config --quiet
      - name: Verify version pinning and no builds
        run: |
          ! grep -R --include='compose*.yml' -E '^\s*build:' .
          ! grep -R --include='compose*.yml' -E 'image:.*:latest([[:space:]]|$)' .
