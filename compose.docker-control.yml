services:
  control:
    environment:
      FLOWCAST_DOCKER_CONTROL_ENABLED: "true"
    group_add:
      - "${FLOWCAST_DOCKER_GID:?FLOWCAST_DOCKER_GID is required for Docker Control}"
    volumes:
      - type: bind
        source: ${FLOWCAST_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
